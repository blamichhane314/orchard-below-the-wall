<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Learning World</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #26221d; }
  canvas { display: block; cursor: default; }
  #title {
    position: fixed; top: 6vh; left: 0; right: 0; text-align: center; pointer-events: none;
    color: #f2ead6; font: normal 2.7em Georgia, serif; letter-spacing: .03em;
    text-shadow: 0 2px 18px #26221d66;
  }
  .door {
    position: fixed; transform: translate(-50%, 0); text-align: center; pointer-events: none;
    color: #f2ead6; font: 1.15em Georgia, serif; text-shadow: 0 1px 10px #26221daa;
    transition: opacity .15s; opacity: .88; width: 240px;
  }
  .door.hot { opacity: 1; }
  .door.hot::after { content: ''; display: block; width: 42px; height: 2px; background: #c8a24a; margin: .45em auto 0; }
  #about {
    position: fixed; bottom: 4.5vh; left: 0; right: 0; text-align: center; z-index: 2;
  }
  #about a {
    color: #f2ead6; font: 1.05em Georgia, serif; text-decoration: none; opacity: .85;
    border-bottom: 1px solid #c8a24a88; padding-bottom: 2px;
  }
  #about a:hover { opacity: 1; border-bottom-color: #c8a24a; }
</style>
</head>
<body>
<div id="title">A Learning World</div>
<div class="door" id="d0">The Orchard Below the Wall</div>
<div class="door" id="d1">The Long Vale</div>
<div class="door" id="d2">The Ways</div>
<div id="about"><a href="about.html">about · how to play</a></div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from './vendor/three/three.module.js';
import { rng, mat, jitter, tree } from './js/build.js';

const P = {
  canopyFar: '#2b4438', canopyMid: '#33553f', canopyNear: '#223a2e', trunk: '#5a4a38',
  ground: '#4a5c3a', groundLit: '#5c6f45', sky: '#cfd9c4', skyHigh: '#a8bda6', mist: '#dfe6d6',
};
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(P.mist), 16, 60);
const camera = new THREE.PerspectiveCamera(50, 1, .1, 200);

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(150, 24, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(P.skyHigh) }, bottom: { value: new THREE.Color(P.mist) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float t = clamp(normalize(vP).y * 1.6 + 0.18, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, t), 1.0); }',
  })
);
scene.add(sky);
scene.add(new THREE.HemisphereLight(new THREE.Color(P.sky), new THREE.Color('#43503b'), 1.05));
scene.add(new THREE.AmbientLight(new THREE.Color('#4a5540'), .8));
const sun = new THREE.DirectionalLight('#f6e8c8', 1.7);
sun.position.set(10, 20, -6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 30, bottom: -20, near: 1, far: 60 });
sun.shadow.bias = -.0004;
scene.add(sun);

const r = rng(515);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120, 48, 48), mat(P.ground, { flatShading: false }));
ground.rotateX(-Math.PI / 2);
{ const a = ground.geometry.attributes.position;
  for (let i = 0; i < a.count; i++) a.setZ(i, Math.sin(a.getX(i) * .2) * Math.cos(a.getY(i) * .17) * .3);
  ground.geometry.computeVertexNormals();
}
ground.receiveShadow = true;
scene.add(ground);

// a worn way forking to the three doors
const strip = (x0, z0, x1, z1, w) => {
  const L = Math.hypot(x1 - x0, z1 - z0);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, L), mat(P.groundLit, { flatShading: false }));
  m.rotateX(-Math.PI / 2);
  m.rotation.z = Math.atan2(x1 - x0, z1 - z0);
  m.position.set((x0 + x1) / 2, .04, (z0 + z1) / 2);
  m.receiveShadow = true;
  scene.add(m);
};
strip(0, -12, 0, 2, 1.6);
strip(0, 2, -8, 9, 1.1); strip(0, 2, 0, 9, 1.1); strip(0, 2, 8, 9, 1.1);

// camera looks north, so +x lands on screen-LEFT: first build leftmost
const DOORS = [
  { x: 8,  href: 'orchard.html', glow: '#e8d9a8' },
  { x: 0,  href: 'vale.html',   glow: '#cfe0b8' },
  { x: -8, href: 'wood.html',   glow: '#eef2da' },
];
const pickables = [];
for (const [i, d] of DOORS.entries()) {
  const g = new THREE.Group();
  for (const dx of [-1.7, 1.7]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(.62, 4.6, .62), mat('#8a8578'));
    post.position.set(dx, 2.3, 0); post.castShadow = true; g.add(post);
  }
  const lintel = new THREE.Mesh(new THREE.BoxGeometry(4.6, .62, .8), mat('#a49d8c'));
  lintel.position.y = 4.75; lintel.castShadow = true; g.add(lintel);
  const slab = new THREE.Mesh(new THREE.PlaneGeometry(3.1, 4.3),
    new THREE.MeshBasicMaterial({ color: d.glow, transparent: true, opacity: .22, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  slab.position.set(0, 2.25, .1);
  g.add(slab);
  d.slab = slab;
  const hit = new THREE.Mesh(new THREE.BoxGeometry(4.8, 5.6, 3), new THREE.MeshBasicMaterial({ visible: false }));
  hit.position.set(0, 2.6, 0);
  hit.userData.door = i;
  g.add(hit);
  pickables.push(hit);
  g.position.set(d.x, 0, 10);
  scene.add(g);
}
// what stands beyond each door — a sliver of its world
{ // orchard: the fig tree, one gold fruit
  const t = tree(P, 91, 1.15); t.group.position.set(8.6, 0, 14); scene.add(t.group);
  const fig = new THREE.Mesh(new THREE.SphereGeometry(.16, 8, 6), mat('#c8a24a', { emissive: new THREE.Color('#7a5c1e'), emissiveIntensity: .6 }));
  fig.position.set(8.1, 2.6, 13.6); scene.add(fig);
}
{ // vale: a gate fence with its open door
  for (const dx of [-1.9, -.7, 1.2, 2.1]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(.22, 1.5, .22), mat('#6b5a40'));
    post.position.set(dx, .75, 14.2); post.castShadow = true; scene.add(post);
  }
  const rail = new THREE.Mesh(new THREE.BoxGeometry(4.6, .12, .14), mat('#6b5a40'));
  rail.position.set(0, 1.18, 14.2); scene.add(rail);
}
{ // the ways: three slim birch trunks, ways parting
  for (const [dx, s] of [[-9.3, 1], [-8.2, 1.2], [-7, .9]]) {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(.09 * s, .14 * s, 4.6 * s, 7), mat('#e8e4da'));
    b.position.set(dx, 2.3 * s, 14.4); b.castShadow = true; scene.add(b);
    for (let k = 0; k < 5; k++) {
      const dash = new THREE.Mesh(new THREE.BoxGeometry(.16 * s, .07, .04), mat('#33302a'));
      dash.position.set(dx, (0.6 + k * .8) * s, 14.4 + .12);
      scene.add(dash);
    }
  }
}
// framing forest
for (let i = 0; i < 46; i++) {
  const x = -34 + r() * 68, z = -6 + r() * 34;
  if (Math.abs(x) < 12 && z < 16) continue;
  if (z > 8 && z < 13) continue;
  const t = tree(P, Math.round(x * 977 + z * 131), .9 + r() * .7);
  t.group.position.set(x, 0, z);
  scene.add(t.group);
}
{ // grass
  const geo = new THREE.ConeGeometry(.045, .3, 5); geo.translate(0, .15, 0);
  const m = new THREE.MeshStandardMaterial({ flatShading: true, roughness: 1 });
  const inst = new THREE.InstancedMesh(geo, m, 500);
  const M = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3();
  for (let i = 0; i < 500; i++) {
    const x = -30 + r() * 60, z = -10 + r() * 32;
    e.set((r() - .5) * .2, r() * Math.PI, (r() - .5) * .2); q.setFromEuler(e);
    sc.setScalar(.7 + r() * 1.2);
    M.compose(new THREE.Vector3(x, 0, z), q, sc);
    inst.setMatrixAt(i, M);
    inst.setColorAt(i, jitter(r() < .3 ? P.groundLit : '#54683c', r, .02, .1, .1));
  }
  inst.receiveShadow = true;
  scene.add(inst);
}

// hover + click
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2(9, 9);
let hot = -1;
const toNDC = (cx, cy) => mouse.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
addEventListener('pointermove', (ev) => toNDC(ev.clientX, ev.clientY));
addEventListener('mousemove', (ev) => toNDC(ev.clientX, ev.clientY));
addEventListener('click', (ev) => {
  // the click carries its own aim — never dependent on a prior hover
  toNDC(ev.clientX, ev.clientY);
  ray.setFromCamera(mouse, camera);
  const h = ray.intersectObjects(pickables, false)[0];
  if (h) location.href = DOORS[h.object.userData.door].href;
});
addEventListener('keydown', (e) => { if (/^[1-3]$/.test(e.key)) location.href = DOORS[+e.key - 1].href; });

const labels = [document.getElementById('d0'), document.getElementById('d1'), document.getElementById('d2')];
const _v = new THREE.Vector3();

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  camera.position.set(Math.sin(t * .12) * .8, 2.6 + Math.sin(t * .21) * .12, -9.5);
  camera.lookAt(0, 2.4, 10);

  ray.setFromCamera(mouse, camera);
  const h = ray.intersectObjects(pickables, false)[0];
  hot = h ? h.object.userData.door : -1;
  canvas.style.cursor = hot >= 0 ? 'pointer' : 'default';
  for (const [i, d] of DOORS.entries()) {
    d.slab.material.opacity = .22 + (i === hot ? .16 : 0) + Math.sin(t * 2 + i) * .02;
    labels[i].classList.toggle('hot', i === hot);
    _v.set(d.x, 5.6, 10).project(camera);
    const lx = Math.max(126, Math.min(innerWidth - 126, (_v.x * .5 + .5) * innerWidth));
    labels[i].style.left = lx + 'px';
    labels[i].style.top = ((-_v.y * .5 + .5) * innerHeight) + 'px';
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
